name: Пост дня в Telegram

on:
  schedule:
    - cron: "17 8 * * *"   # каждый день в 10:17 по Кишинёву (08:17 UTC зимой)
  workflow_dispatch:
    inputs:
      date:
        description: "Дата поста ГГГГ-ММ-ДД (пусто = сегодня)"
        required: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Проверить, что бот настроен
        id: check
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "Секрет TELEGRAM_BOT_TOKEN не задан — пропускаю."; echo "ready=no" >> "$GITHUB_OUTPUT"; else echo "ready=yes" >> "$GITHUB_OUTPUT"; fi
      - name: Опубликовать
        if: steps.check.outputs.ready == 'yes'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POST_DATE: ${{ github.event.inputs.date }}
        run: python3 tools/post_telegram.py
