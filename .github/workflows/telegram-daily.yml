name: Пост дня в Telegram

on:
  schedule:
    - cron: "7 8 * * *"    # каждый день ~10:07–10:30 по Кишинёву (GitHub часто запускает с опозданием)
    - cron: "47 8 * * *"   # запасной запуск, если первый GitHub пропустил; повтора не будет — пост отмечается в content/.posted/
  workflow_dispatch:
    inputs:
      date:
        description: "Дата поста ГГГГ-ММ-ДД (пусто = сегодня)"
        required: false

permissions:
  contents: write

concurrency:
  group: telegram-daily
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Проверить, что бот настроен
        id: check
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "Секрет TELEGRAM_BOT_TOKEN не задан — пропускаю."; echo "ready=no" >> "$GITHUB_OUTPUT"; else echo "ready=yes" >> "$GITHUB_OUTPUT"; fi
      - name: Опубликовать
        if: steps.check.outputs.ready == 'yes'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POST_DATE: ${{ github.event.inputs.date }}
        run: python3 tools/post_telegram.py
      - name: Отметить, что пост опубликован
        if: steps.check.outputs.ready == 'yes'
        run: |
          if [ -n "$(git status --porcelain content/.posted)" ]; then
            git config user.name "webcore-bot"
            git config user.email "webcore-bot@users.noreply.github.com"
            git add content/.posted
            git commit -m "Опубликован пост в Telegram"
            git pull --rebase -q && git push
          fi
